<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anh iu em</title>
    <link rel="shortcut icon" href="favicon-16x16.png" type="image/x-icon" />
    <style>
      body {
        text-align: center;
        background-color: #f9d9e1;
        font-family: "Comic Sans MS", cursive, sans-serif;
        font-size: 20px;
      }
      .container {
        margin-top: 50px;
      }
      .character {
        display: inline-block;
        margin: 20px;
        text-align: center;
      }
      .character img {
        width: 150px;
        height: auto;
        border-radius: 10px;
      }
      .speech {
        margin-top: 10px;
        background: #fff;
        display: inline-block;
        padding: 10px 15px;
        border-radius: 10px;
        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
        font-weight: bold;
        color: #ff4081;
      }
      .big-img img {
        justify-content: center;
        align-items: center;
        margin-top: 60px;
      }
    </style>
  </head>
  <body>
    <h1 style="color: #ff4081">Những lời nhắn nhủ của tớ</h1>
    <div class="container">
      <div class="character">
        <img
          src="https://www.sanrio.com.hk/_ul/character_profile_pompompurin.png"
          alt="Pompompurin"
        />
        <div class="speech">ANH YÊU EM NHIỀU LẮM</div>
      </div>
      <div class="character">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQLYgydrFWtiKTTVUIT2lFGrYPADX501d0U0w&s"
          alt="Chikawa"
        />
        <div class="speech">EM PHẢI MẠNH MẼ LÊN</div>
      </div>
      <div class="character">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnxZFTAeWAWdRkWibuA0mEB6lHww109Rmiy8LWt8UWzBpxMIoVNIBARudW7B-Av67xOsM&usqp=CAU"
          alt="Cinnamoroll"
        />
        <div class="speech">CHÚNG MÌNH NHẤT ĐỊNH SẼ LÀM ĐƯỢC</div>
      </div>
      <div class="character">
        <img
          src="https://w7.pngwing.com/pngs/933/306/png-transparent-sticker-facebook-pin-decal-bun-facebook-love-heart-pin.png"
          alt="Cinnamoroll"
        />
        <div class="speech">CHÚNG MÌNH NHẤT ĐỊNH SẼ LÀM ĐƯỢC</div>
